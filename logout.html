<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الخروج | Gima Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-buttons {
            width: 100%;
            text-align: center;
        }

        .page-buttons button {
            background: #8b2be2;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin: 4px;
        }

        .video-box {
            width: 100%;
        }

        video {
            display: block;
            width: 300px;
            height: 300px;
            max-width: 100%;
            margin: auto;
            border-radius: 18px;
            object-fit: contain;
        }

        .box {
            width: 100%;
            padding: 25px;
            text-align: center;
            background: #111;
            border: 1px solid #8b2be2;
            border-radius: 25px;
            box-shadow: 0 0 15px #6a1b9a;
        }

        h2 {
            color: #c084fc;
            font-size: 27px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .logout-button {
            background: #8b2be2;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.85;
        }

        /* الوضع الفاتح */
        body.light-mode {
            background: #f5edfc;
            color: #333;
        }

        body.light-mode .box {
            background: white;
            color: #333;
        }

        body.light-mode .box h2 {
            color: #7044a3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="page-buttons">
            <button type="button" id="languageButton">🌐 English</button>
            <button type="button" id="themeButton">☀️ الوضع الفاتح</button>
        </div>

      <div class="video-box">
    <img src="Ayat.png"
         alt="رسالة وداع من Gima Store"
         width="300"
         height="300"
         style="object-fit: contain; border-radius: 18px;">
    <div>
      
        <div class="box">

            <h2 data-ar="تسجيل الخروج 💜"
                data-en="Log Out 💜">
                تسجيل الخروج 💜
            </h2>

            <p
                data-ar="هل أنتِ متأكدة من تسجيل الخروج من متجرنا؟"
                data-en="Are you sure you want to log out of our store?">
                هل أنتِ متأكدة من تسجيل الخروج من متجرنا؟
            </p>
          

            <button type="button" class="logout-button"
                    id="logoutButton"
                    data-ar="نعم، تسجيل الخروج"
                    data-en="Yes, Log Out"
                    onclick="logout()">
                نعم، تسجيل الخروج
            </button>

        </div>

    </div>

    <script src="home.js"></script>

    <script>
        function logout() {
            const isArabic = document.documentElement.lang === "ar";

            alert(
                isArabic
                ? "شكراً لاختيارك متجرنا 💜\n\nسعداء بأننا كنا جزءاً من يومك.\n\nنتمنى زيارتك لنا مرة أخرى ✨"
                : "Thank you for choosing our store 💜\n\nWe are happy to have been part of your day.\n\nWe hope to see you again! ✨"
            );

            window.location.href = "login.html";
        }
    </script>

</body>
</html>
