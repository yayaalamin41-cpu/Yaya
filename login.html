
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر غيمة</title>
    <link rel="stylesheet" href="login.css">
    <script src="in.js" defer></script>
</head>

<body>

    <div class="top-buttons">
        <button id="languageButton">🌐 English</button>
        <button id="themeButton">🌙 الوضع الداكن</button>
        <button id="warningButton">⚠️ تنبيه</button>
    </div>

    <div class="warning-message" id="warningMessage" hidden>
        ⚠️ لا تشارك كلمة المرور مع أي شخص حفاظاً على أمان حسابك.
    </div>

    <main class="login-container">

        <h1 id="storeName">💜 متجر غيمة 🛍️</h1>

        <h2 data-ar="تسجيل الدخول" data-en="Login">
            تسجيل الدخول
        </h2>

        <p data-ar="مرحباً بك في متجر غيمة"
           data-en="Welcome to Gima Store">
            مرحباً بك في متجر غيمة
        </p>

        <form action="home.html" method="POST">

            <label data-ar="البريد الإلكتروني"
                   data-en="Email Address">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                name="email"
                placeholder="أدخل بريدك الإلكتروني"
                required
            >

            <label data-ar="كلمة المرور"
                   data-en="Password">
                كلمة المرور
            </label>

            <input
    type="password"
    name="password"
    placeholder="أدخل كلمة المرور"
    minlength="6"
    maxlength="12"
    pattern="[A-Za-z0-9]{6,12}"
    title="كلمة المرور يجب أن تتكون من 6 إلى 12 حرفاً أو رقماً"
    required

            >

            <button type="submit" class="login-button"
                    data-ar="تسجيل الدخول"
                    data-en="Sign In">
                تسجيل الدخول
            </button>

        </>

    </main>

</body>
</html>
